<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">TrackpadGuard 트랙패드 활성화 영역 개념도</title>
  <desc id="desc">키보드 입력 중에는 트랙패드 터치를 무시하고, 원래 삼각형의 위쪽 3분의 1을 제외한 아래쪽 사다리꼴 영역을 터치하면 트랙패드가 다시 작동하는 구조</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E8EDF4"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75E0B4" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#17A66B" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
    <clipPath id="trackpadClip">
      <rect x="150" y="170" width="900" height="780" rx="42"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#background)"/>

  <text x="600" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="700" fill="#172033">키 입력 중 트랙패드 동작 방식</text>
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="21" fill="#5A6578">상단 1/3을 제외한 아래 영역을 터치하면 즉시 다시 작동</text>

  <g filter="url(#shadow)">
    <rect x="150" y="170" width="900" height="780" rx="42" fill="#D6DBE3" stroke="#AAB2C0" stroke-width="4"/>
    <g clip-path="url(#trackpadClip)">
      <rect x="150" y="170" width="900" height="780" fill="#CDD3DC"/>
      <path d="M450 430 L750 430 L1050 950 L150 950 Z" fill="url(#active)"/>
      <path d="M450 430 L750 430 L1050 950 L150 950 Z" fill="none" stroke="#08794C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="150" y="170" width="900" height="780" rx="42" fill="none" stroke="#9EA7B5" stroke-width="4"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
    <path d="M600 170 L450 430 L750 430 Z" fill="#B8C0CC" stroke="#8E98A8" stroke-width="3" stroke-dasharray="10 9"/>
    <text x="600" y="330" text-anchor="middle" font-size="21" font-weight="700" fill="#5D6675">상단 1/3 제외</text>

    <rect x="435" y="540" width="330" height="112" rx="24" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="600" y="584" text-anchor="middle" font-size="26" font-weight="700" fill="#08794C">다시 작동하는 영역</text>
    <text x="600" y="622" text-anchor="middle" font-size="20" fill="#24634B">아래쪽 2/3 영역을 한 번 터치</text>

    <text x="262" y="465" text-anchor="middle" font-size="22" font-weight="600" fill="#5D6675">터치 무시</text>
    <text x="938" y="465" text-anchor="middle" font-size="22" font-weight="600" fill="#5D6675">터치 무시</text>

    <circle cx="450" cy="430" r="10" fill="#08794C"/>
    <circle cx="750" cy="430" r="10" fill="#08794C"/>
    <circle cx="150" cy="950" r="10" fill="#08794C"/>
    <circle cx="1050" cy="950" r="10" fill="#08794C"/>

    <rect x="376" y="1015" width="448" height="52" rx="26" fill="#172033"/>
    <text x="600" y="1049" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">키를 누르는 동안: 회색 영역의 모든 터치 무시</text>
  </g>
</svg>
